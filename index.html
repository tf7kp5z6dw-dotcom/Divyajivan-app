const UploadPrescriptionScreen=({onBack,showToast})=>{
const fileRef=useRef(null);
const[uploads,setUploads]=useState([]);
const[reviewing,setReviewing]=useState(false);
const[showPicker,setShowPicker]=useState(false);
const handleFile=(e)=>{
const files=Array.from(e.target.files||[]);
files.forEach(f=>{
const reader=new FileReader();
reader.onload=()=>setUploads(prev=>[...prev,{name:f.name,size:(f.size/1024).toFixed(1)+'KB',type:f.type,preview:reader.result,id:Date.now()+Math.random()}]);
reader.readAsDataURL(f);
});
if(fileRef.current)fileRef.current.value='';
};
const takePhoto=()=>{
setShowPicker(false);
const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
inp.onchange=(e)=>handleFile(e);inp.click();
};
const uploadFiles=()=>{
setShowPicker(false);
const inp=document.createElement('input');inp.type='file';inp.accept='image/*,.pdf,.jpg,.jpeg,.png';inp.multiple=true;
inp.onchange=(e)=>handleFile(e);inp.click();
};
const submitPrescription=()=>{
if(uploads.length===0){showToast('Please upload a prescription first');return}

))}
</div>

].map(o=>(
<button key={o.label} onClick={o.fn} className="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 transition">
<div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style={{backgroundColor:o.bg}}>
<I name={o.icon} size={22} style={{color:o.color}}/>
</div>
<div className="text-left">
<p className="text-sm font-semibold text-slate-800">{o.label}</p>
<p className="text-xs text-slate-400">{o.sub}</p>
</div>
</button>
))}
</div>
)}
</div>

<div className="mb-4">

pdf.save('Invoice_'+order.id+'.pdf');

const useJivanPoints=()=>{
const[pointsData,setPointsData]=useState(initPointsData);

const earnedTotal=pointsData.transactions.filter(t=>t.type==='earn'&&t.status!=='pending').reduce((s,t)=>s+t.points,0);

};
return{...pointsData,earnedTotal,usedTotal,expiredTotal,expiringIn30,redeemPoints,conversion:REWARDS_CONFIG.pointsToRupeeConversion,maxPct:REWARDS_CONFIG.maxRedemptionPercentage};
};

<div className="w-20 h-20 rounded-full bg-pri-50 flex items-center justify-center mb-6"><I name="mark_email_read" size={40} className="text-pri-600"/></div>
<h2 className="text-xl font-bold text-slate-800 mb-2">Reset link sent</h2>
<p className="text-sm text-slate-500 text-center mb-8 leading-relaxed">Check your inbox at <span className="font-semibold text-slate-700">{email}</span> for a password reset link.</p>
<button onClick={()=>onSwitch('login')} className="w-full py-3.5 rounded-xl font-semibold text-sm text-white" style={{background:'linear-gradient(135deg,#0FA572,#0C8A5F)',boxShadow:'0 4px 16px rgba(15,165,114,0.3)'}}>Back to Sign In</button>
</div>
);
return(
<div className="flex flex-col h-full" style={{background:'linear-gradient(180deg,#F0FAF5 0%,#FDFBF7 40%,#fff 100%)'}}>
<div className="flex-1 flex flex-col justify-center px-6">
<div className="flex flex-col items-center mb-8">
<div className="w-20 h-20 rounded-full bg-pri-50 flex items-center justify-center mb-4"><I name="lock_reset" size={40} className="text-pri-600"/></div>
<h1 className="text-2xl font-extrabold" style={{color:'#0C8A5F'}}>Forgot Password?</h1>
<p className="text-sm text-slate-400 mt-1 text-center">Enter your email and we'll send you a reset link</p>
</div>
{error&&<div className="mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-100"><p className="text-sm text-red-600">{error}</p></div>}
<AuthInput label="Email" type="email" value={email} onChange={setEmail} placeholder="you@example.com" icon="mail"/>
<button onClick={handleReset} disabled={loading} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm transition mt-2" style={{background:loading?'#94A3B8':'linear-gradient(135deg,#0FA572,#0C8A5F)',boxShadow:loading?'none':'0 4px 16px rgba(15,165,114,0.3)'}}>
{loading?'Sending...':'Send Reset Link'}
</button>
</div>
<div className="px-6 pb-8 text-center">
<button onClick={()=>onSwitch('login')} className="text-sm font-semibold text-pri-600 flex items-center gap-1 mx-auto"><I name="arrow_back" size={16}/> Back to Sign In</button>
</div>
</div>
);};

const UpdatePopup=({onUpdate,onSkip,darkMode})=>(
<div className="upd-overlay" onClick={onSkip}>
<div className={`upd-card ${darkMode?'dark-mode':''}`} onClick={e=>e.stopPropagation()}>
<div className="upd-top">
<div className="upd-icon-wrap">
<img src="logo.webp" alt="Divyajivan" style={{width:52,height:52,objectFit:'contain'}}/>
</div>
<svg width="120" height="3" style={{opacity:0.3}}><rect width="120" height="3" rx="1.5" fill="#0FA572"/></svg>
</div>
<div className="upd-body">
<div className="upd-title">New Update Available</div>
<div className="upd-desc">We've made improvements to give you a better experience. Update now to enjoy the latest features and fixes.</div>
<button className="upd-btn" onClick={onUpdate}>Update Now</button>
<button className="upd-skip" onClick={onSkip}>Later</button>
</div>
</div>
</div>
);

const App=()=>{
const[session,setSession]=useState(null);
const[authLoading,setAuthLoading]=useState(true);
const[authView,setAuthView]=useState('login');
const[splash,setSplash]=useState(true);
const[splashFade,setSplashFade]=useState(false);
useEffect(()=>{const t1=setTimeout(()=>setSplashFade(true),2200);const t2=setTimeout(()=>setSplash(false),2700);return()=>{clearTimeout(t1);clearTimeout(t2)};},[]);
useEffect(()=>{
supabaseClient.auth.getSession().then(({data:{session:s}})=>{setSession(s);setAuthLoading(false)});
const{data:{subscription}}=supabaseClient.auth.onAuthStateChange((_ev,s)=>{setSession(s)});
return()=>subscription.unsubscribe();
},[]);
const handleLogout=async()=>{await supabaseClient.auth.signOut()};
const[screen,setScreen]=useState('home');
const[detail,setDetail]=useState(null);
const[cart,setCart]=useState([]);
const[toast,setToast]=useState('');
const[history,setHistory]=useState([]);
const[catFilter,setCatFilter]=useState(null);
const[location,setLocation]=useState('Surat');
const[showLocModal,setShowLocModal]=useState(false);
const[usePoints,setUsePoints]=useState(false);
const[orders,setOrders]=useState(()=>{try{return JSON.parse(localStorage.getItem('dj_orders'))||[]}catch(e){return[]}});
const[chatHistory,setChatHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem('dj_chat_history'))||[]}catch(e){return[]}});
const[darkMode,setDarkMode]=useState(()=>{try{return localStorage.getItem('dj_dark_mode')==='true'}catch(e){return false}});
const toggleDark=()=>setDarkMode(p=>{const v=!p;try{localStorage.setItem('dj_dark_mode',v)}catch(e){}return v});
const[family,setFamily]=useState(()=>{try{const s=localStorage.getItem('dj_family');return s?JSON.parse(s):FAMILY_INIT}catch(e){return FAMILY_INIT}});
const updateFamily=(newFam)=>{setFamily(newFam);try{localStorage.setItem('dj_family',JSON.stringify(newFam))}catch(e){}};
const[userProfile,setUserProfile]=useState(()=>{try{const s=localStorage.getItem('dj_user_profile');return s?{...USER_INIT,...JSON.parse(s)}:USER_INIT}catch(e){return USER_INIT}});
const updateUserProfile=(u)=>{setUserProfile(u);try{localStorage.setItem('dj_user_profile',JSON.stringify(u))}catch(e){}};
const[showUpdate,setShowUpdate]=useState(false);
useEffect(()=>{if(splash)return;try{const seen=localStorage.getItem('dj_app_version');if(seen!==APP_VERSION){const t=setTimeout(()=>setShowUpdate(true),400);return()=>clearTimeout(t)}}catch(e){const t=setTimeout(()=>setShowUpdate(true),400);return()=>clearTimeout(t)}},[splash]);
const scrollRef=useRef(null);
const points=useJivanPoints();
const addChatMsg=(msg)=>{setChatHistory(prev=>{const n=[...prev,msg];try{localStorage.setItem('dj_chat_history',JSON.stringify(n.slice(-50)))}catch(e){}return n})};

const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(''),2000)};

const nav=(page,data)=>{
setHistory(h=>[...h,screen]);
setScreen(page);
if(data)setDetail(data);else setDetail(null);
setTimeout(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0},10);
};

const goBack=()=>{
if(history.length>0){
const prev=history[history.length-1];
setHistory(h=>h.slice(0,-1));
setScreen(prev);
setTimeout(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0},10);
} else {
setScreen('home');setDetail(null);
setTimeout(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0},10);
}
};

const addToCart=(item)=>{
setCart(prev=>{
const ex=prev.find(c=>c.id===item.id);
if(ex)return prev.map(c=>c.id===item.id?{...c,qty:c.qty+1}:c);
return[...prev,{...item,qty:1}];
});
showToast(item.name+' added to cart');
};

const updateQty=(id,delta)=>{
setCart(prev=>{
const updated=prev.map(c=>{
if(c.id!==id)return c;
const nq=c.qty+delta;
return nq<1?null:{...c,qty:nq};
}).filter(Boolean);
return updated;
});
};

const removeItem=(id)=>setCart(prev=>prev.filter(c=>c.id!==id));

const onCatMeds=(cat)=>{setCatFilter(cat);nav('medicines')};

const openMedDetail=(m)=>{setHistory(h=>[...h,screen]);setScreen('med-detail');setDetail(m);if(scrollRef.current)scrollRef.current.scrollTop=0;};
const openLabDetail=(t)=>{setHistory(h=>[...h,screen]);setScreen('lab-detail');setDetail(t);if(scrollRef.current)scrollRef.current.scrollTop=0;};
const openDocDetail=(d)=>{setHistory(h=>[...h,screen]);setScreen('doc-detail');setDetail(d);if(scrollRef.current)scrollRef.current.scrollTop=0;};

const handleCheckout=()=>{
const subtotal=cart.reduce((s,c)=>s+c.price*c.qty,0);
let pointsDiscount=0;
if(usePoints&&points.available>=REWARDS_CONFIG.minimumRedemptionPoints){
const maxVal=subtotal*REWARDS_CONFIG.maxRedemptionPercentage/100;
const maxPts=Math.floor(maxVal*points.conversion);
const usablePts=Math.min(points.available,maxPts);
pointsDiscount=usablePts/points.conversion;
if(usablePts>0)points.redeemPoints(usablePts,'DJ'+Date.now(),'Used on Medicine Order');
}
const order={id:'ORD'+Date.now(),items:cart.map(c=>({name:c.name,brand:c.brand,pack:c.pack,price:c.price,qty:c.qty,icon:c.img||'medication'})),total:subtotal-pointsDiscount,pointsSaved:pointsDiscount,status:'confirmed',date:Date.now()};
setOrders(prev=>{const n=[order,...prev];try{localStorage.setItem('dj_orders',JSON.stringify(n.slice(-20)))}catch(e){}return n});
setCart([]);setUsePoints(false);
showToast('Order placed successfully!'+(pointsDiscount>0?' Saved ₹'+pointsDiscount+' with Jivan Points':''));
goBack();
};

const mainTabs=['home','medicines','lab-tests','consult','profile'];
const isMainTab=mainTabs.includes(screen);
const cartCount=cart.reduce((s,c)=>s+c.qty,0);

const renderScreen=()=>{
switch(screen){
case 'home':return <HomeScreen nav={nav} cartCount={cartCount} onCart={()=>nav('cart')} onCatMeds={onCatMeds} showToast={showToast} location={location} onLocationClick={()=>setShowLocModal(true)}/>;
case 'medicines':return <MedicinesScreen nav={nav} onDetail={openMedDetail} onAdd={addToCart} catFilter={catFilter} clearCatFilter={()=>setCatFilter(null)} cart={cart} cartCount={cartCount} onCart={()=>nav('cart')} updateQty={updateQty}/>;
case 'lab-tests':return <LabTestsScreen nav={nav} onDetail={openLabDetail}/>;
case 'consult':return <ConsultScreen nav={nav} onDetail={openDocDetail} onBack={goBack}/>;
case 'profile':return <ProfileScreen nav={nav} darkMode={darkMode} toggleDark={toggleDark} family={family} userProfile={userProfile} session={session} onLogout={handleLogout}/>;
case 'med-detail':return detail?<MedicineDetailScreen item={detail} onBack={goBack} onAdd={addToCart} cart={cart} cartCount={cartCount} onCart={()=>nav('cart')} updateQty={updateQty} onAskAI={addChatMsg} nav={nav}/>:null;
case 'lab-detail':return detail?<LabTestDetailScreen item={detail} onBack={goBack}/>:null;
case 'doc-detail':return detail?<DoctorDetailScreen item={detail} onBack={goBack} nav={nav}/>:null;
case 'cart':return <CartScreen cart={cart} onBack={goBack} updateQty={updateQty} removeItem={removeItem} onCheckout={handleCheckout} points={points} usePoints={usePoints} setUsePoints={setUsePoints}/>;
case 'health-records':return <HealthRecordsScreen onBack={goBack}/>;
case 'my-orders':return <MyOrdersScreen onBack={goBack} orders={orders} onOrderDetail={(o)=>{setHistory(h=>[...h,screen]);setDetail(o);setScreen('order-detail');if(scrollRef.current)scrollRef.current.scrollTop=0}}/>;
case 'order-detail':return detail?<OrderDetailScreen onBack={goBack} order={detail} showToast={showToast} onReorder={(items)=>{items.forEach(it=>{const med=MEDICINES.find(m=>m.name===it.name);if(med)addToCart(med)});nav('cart')}} onUpdateOrder={(id,updates)=>{setOrders(prev=>{const n=prev.map(o=>o.id===id?{...o,...updates}:o);try{localStorage.setItem('dj_orders',JSON.stringify(n))}catch(e){}return n});setDetail(prev=>prev&&prev.id===id?{...prev,...updates}:prev)}}/>:null;
case 'membership':return <MembershipScreen onBack={goBack}/>;
case 'insurance':return <InsuranceScreen onBack={goBack} showToast={showToast}/>;
case 'telemedicine':return <TelemedicineScreen onBack={goBack}/>;
case 'medical-tourism':return <MedicalTourismScreen onBack={goBack}/>;
case 'upload-prescription':return <UploadPrescriptionScreen onBack={goBack} showToast={showToast}/>;
case 'points':return <JivanPointsScreen onBack={goBack} nav={nav} points={points}/>;
case 'points-history':return <PointsHistoryScreen onBack={goBack} points={points}/>;
case 'points-rules':return <PointsRulesScreen onBack={goBack}/>;
case 'ai-chat':return <AIHealthAssistantScreen onBack={goBack} chatHistory={chatHistory} onAskAI={addChatMsg}/>;
case 'doc-chat':return detail?<DoctorChatScreen doctor={detail} onBack={goBack}/>:null;
case 'book-appt':return detail?<BookAppointmentScreen doctor={detail} onBack={goBack} showToast={showToast} family={family} userProfile={userProfile}/>:null;
case 'my-consultations':return <MyConsultationsScreen onBack={goBack} nav={nav}/>;
case 'family-members':return <FamilyMembersScreen family={family} updateFamily={updateFamily} onBack={goBack} showToast={showToast} nav={nav}/>;
case 'your-profile':return <YourProfileScreen onBack={goBack} userProfile={userProfile} updateUserProfile={updateUserProfile} showToast={showToast}/>;
case 'family-profile':return detail?<FamilyMemberProfileScreen member={detail} onBack={goBack} family={family} updateFamily={updateFamily} showToast={showToast} userProfile={userProfile}/>:null;
default:return <HomeScreen nav={nav} cartCount={cartCount} onCart={()=>nav('cart')} onCatMeds={onCatMeds} showToast={showToast} location={location} onLocationClick={()=>setShowLocModal(true)}/>;
}
};

if(authLoading)return <AuthLoadingScreen/>;
if(!session){
if(authView==='signup')return <SignUpScreen onSwitch={setAuthView}/>;
if(authView==='forgot')return <ForgotPasswordScreen onSwitch={setAuthView}/>;
return <LoginScreen onSwitch={setAuthView}/>;
}

if(splash)return(
<div className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center ${splashFade?'splash-fade-out':''}`} style={{background:'#FDFBF7'}}>
<div className="flex flex-col items-center px-6">
<div className="splash-logo-in" style={{marginBottom:'clamp(24px, 5vh, 48px)'}}>
<div style={{width:'clamp(100px, 28vw, 160px)',height:'clamp(100px, 28vw, 160px)',padding:'clamp(10px, 3vw, 20px)',borderRadius:'clamp(20px, 6vw, 36px)',background:'#F0FAF5',display:'flex',alignItems:'center',justifyContent:'center'}}>
<img src="logo.webp" alt="Divyajivan" style={{width:'100%',height:'100%',objectFit:'contain',filter:'brightness(1.15) saturate(1.2)'}}/>
</div>
</div>
<h1 className="splash-text-in font-extrabold tracking-tight text-center" style={{color:'#0C8A5F',fontSize:'clamp(32px, 8vw, 52px)'}}>Divyajivan</h1>
<p className="splash-sub-in font-medium text-center" style={{color:'#94A3B8',fontSize:'clamp(14px, 3.5vw, 20px)',marginTop:'clamp(8px, 2vh, 16px)'}}>Health care app</p>
</div>
</div>
);

return(
<div className={`app-shell h-screen bg-white flex flex-col relative shadow-2xl mx-auto overflow-hidden ${darkMode?'dark-mode':''}`}>
<div ref={scrollRef} className="flex-1 overflow-y-auto no-scroll" style={{paddingBottom:isMainTab?68:0}}>
{renderScreen()}
</div>
{isMainTab&&<BottomNav active={screen} onNav={(id)=>{setScreen(id);setDetail(null);setHistory([]);setTimeout(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0},10)}}/>}
<Toast msg={toast} show={!!toast}/>
<LocationModal show={showLocModal} onClose={()=>setShowLocModal(false)} location={location} setLocation={setLocation}/>
{showUpdate&&<UpdatePopup darkMode={darkMode} onUpdate={()=>{try{localStorage.setItem('dj_app_version',APP_VERSION)}catch(e){}setShowUpdate(false)}} onSkip={()=>{try{localStorage.setItem('dj_app_version',APP_VERSION)}catch(e){}setShowUpdate(false)}}/>}
</div>
);
};

/* ── SCREEN: DOCTOR CHAT ── */
const DoctorChatScreen=({doctor,onBack})=>{
const[msgs,setMsgs]=useState(()=>{try{return JSON.parse(localStorage.getItem('dj_doc_chat_'+doctor.id))||[]}catch(e){return[]}});
const[input,setInput]=useState('');
const chatEnd=useRef(null);
useEffect(()=>{if(chatEnd.current)chatEnd.current.scrollIntoView({behavior:'smooth'})},[msgs]);
const send=()=>{if(!input.trim())return;const m={text:input.trim(),from:'user',time:Date.now()};const n=[...msgs,m];setMsgs(n);try{localStorage.setItem('dj_doc_chat_'+doctor.id,JSON.stringify(n.slice(-50)))}catch(e){}setInput('');};
const fmt=(ts)=>{const d=new Date(ts);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
return(
<div className="fade-in flex flex-col" style={{height:'100%'}}>
<div className="flex items-center justify-between px-4 py-3 border-b border-slate-100">
<h1 className="text-lg font-bold text-slate-800">{doctor.name}</h1>
<button onClick={onBack} className="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100"><I name="close" size={22} className="text-slate-700"/></button>
</div>
<div className="px-4 py-2 bg-amber-50 border-b border-amber-100">
<p className="text-xs text-slate-500">Not for emergencies. Replies can take a day or more. If this is urgent, call 108 or go to the nearest emergency department.</p>
</div>
<div className="flex-1 overflow-y-auto px-4 py-4 no-scroll">
{msgs.length===0&&<p className="text-center text-slate-300 py-12 text-sm">No messages yet. Start a conversation.</p>}
{msgs.map((m,i)=>(
<div key={i} className={`flex mb-3 ${m.from==='user'?'justify-end':'justify-start'}`}>
<div className={`max-w-[75%] px-4 py-2.5 rounded-2xl ${m.from==='user'?'bg-slate-800 text-white':'bg-slate-100 text-slate-700'}`}>
<p className="text-sm">{m.text}</p>
<p className={`text-[10px] mt-1 ${m.from==='user'?'text-slate-400':'text-slate-400'}`}>{fmt(m.time)}</p>
</div>
</div>
))}
<div ref={chatEnd}/>
</div>
<div className="px-4 py-3 border-t border-slate-100 flex gap-2" style={{paddingBottom:'max(12px,env(safe-area-inset-bottom))'}}>
<input type="text" placeholder="Write a message..." className="flex-1 bg-slate-50 rounded-full px-4 py-2.5 text-sm outline-none border border-slate-200" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send()}}/>
<button onClick={send} className="w-10 h-10 flex items-center justify-center"><I name="send" size={22} className="text-slate-400"/></button>
</div>
</div>
);};

/* ── PROFILE DETAIL CARD ── */
const ProfileField=({label,value,extra})=>(
<div className="mb-4">
<p className="text-xs text-slate-400 mb-0.5">{label}</p>
<p className="text-base font-semibold text-slate-800">{value}</p>
{extra&&<p className="text-xs text-slate-400 mt-0.5">{extra}</p>}
</div>
);

/* ── BLOOD GROUPS ── */
const BLOOD_GROUPS=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const ProfInput=({label,value,onChange,type})=>(
<div className="mb-3">
<p className="text-xs text-slate-400 mb-1">{label}</p>
<input type={type||'text'} className="w-full bg-slate-50 rounded-xl px-4 py-2.5 text-sm outline-none border border-slate-200" value={value} onChange={e=>onChange(e.target.value)}/>
</div>
);

/* ── SCREEN: YOUR PROFILE ── */
const YourProfileScreen=({onBack,userProfile,updateUserProfile,showToast})=>{
const[editYou,setEditYou]=useState(false);
const[editAddr,setEditAddr]=useState(false);
const[f,setF]=useState({});
const startEditYou=()=>{setF({name:userProfile.name,dob:userProfile.dob,bloodGroup:userProfile.bloodGroup,mobile:userProfile.mobile,gender:userProfile.gender});setEditYou(true);setEditAddr(false)};
const startEditAddr=()=>{setF({...userProfile.address});setEditAddr(true);setEditYou(false)};
const saveYou=()=>{const n=f.name?.trim();if(!n){showToast('Name is required');return}const age=f.dob?Math.floor((Date.now()-new Date(f.dob).getTime())/31557600000):userProfile.age;const initials=(()=>{const p=n.split(/\s+/).filter(Boolean);return p.length<2?p[0]?.substring(0,2).toUpperCase()||'??':(p[0][0]+p[p.length-1][0]).toUpperCase()})();updateUserProfile({...userProfile,name:n,dob:f.dob||userProfile.dob,age,bloodGroup:f.bloodGroup||userProfile.bloodGroup,mobile:f.mobile||userProfile.mobile,gender:f.gender||userProfile.gender,initials});setEditYou(false);showToast('Profile updated')};
const saveAddr=()=>{updateUserProfile({...userProfile,address:{line:f.line||'',city:f.city||'',district:f.district||'',state:f.state||'',pin:f.pin||'',country:f.country||'IN'}});setEditAddr(false);showToast('Address updated')};
const u=userProfile;
return(
<div className="fade-in" style={{background:'#F5F5F0'}}>
<div className="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white" style={{position:'relative'}}>
<span className="text-lg font-bold text-slate-800 flex-1 text-center">Your profile</span>
<button onClick={onBack} className="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100" style={{position:'absolute',right:16}}><I name="close" size={22} className="text-slate-700"/></button>
</div>
<div className="px-4 pt-5 pb-4">
<div className="flex items-center justify-between mb-3">
<h2 className="text-lg font-bold text-slate-800">You</h2>
{!editYou?<button onClick={startEditYou} className="text-sm font-semibold text-pri-600">Edit</button>:<button onClick={()=>setEditYou(false)} className="text-sm font-semibold text-slate-400">Cancel</button>}
</div>
{editYou?(
<div className="bg-white rounded-2xl p-5 mb-4">
<ProfInput label="Name" value={f.name||''} onChange={v=>setF(p=>({...p,name:v}))}/>
<ProfInput label="Date of birth" value={f.dob||''} onChange={v=>setF(p=>({...p,dob:v}))} type="date"/>
<div className="mb-3">
<p className="text-xs text-slate-400 mb-1">Sex at birth</p>
<div className="flex gap-2">
{['Male','Female','Other'].map(g=>(
<button key={g} onClick={()=>setF(p=>({...p,gender:g}))} className={`flex-1 py-2.5 rounded-xl text-sm font-medium border ${f.gender===g?'bg-slate-800 text-white border-slate-800':'bg-slate-50 text-slate-600 border-slate-200'}`}>{g}</button>
))}
</div>
</div>
<div className="mb-3">
<p className="text-xs text-slate-400 mb-1">Blood group</p>
<div className="flex flex-wrap gap-2">
{BLOOD_GROUPS.map(bg=>(
<button key={bg} onClick={()=>setF(p=>({...p,bloodGroup:bg}))} className={`px-3 py-2 rounded-xl text-sm font-medium border ${f.bloodGroup===bg?'bg-slate-800 text-white border-slate-800':'bg-slate-50 text-slate-600 border-slate-200'}`}>{bg}</button>
))}
</div>
</div>
<ProfInput label="Mobile" value={f.mobile||''} onChange={v=>setF(p=>({...p,mobile:v}))} type="tel"/>
<button onClick={saveYou} className="w-full py-2.5 text-sm font-semibold text-white bg-pri-600 rounded-xl mt-2">Save</button>
</div>
):(
<div className="bg-white rounded-2xl p-5 mb-4">
<ProfileField label="Name" value={u.name}/>
<ProfileField label="Date of birth" value={u.dob}/>
<ProfileField label="Age" value={u.age}/>
<ProfileField label="Sex at birth" value={u.gender}/>
<div className="mb-4">
<div className="flex items-center justify-between">
<p className="text-xs text-slate-400 mb-0.5">Blood group</p>
<button onClick={startEditYou} className="text-sm font-semibold text-pri-600">Change</button>
</div>
<p className="text-base font-semibold text-slate-800">{u.bloodGroup}</p>

</div>
<div className="flex-1 min-w-0">
<p className="text-sm font-bold text-slate-800">{d.name}</p>
<p className="text-xs text-slate-400 truncate">{d.lastMsg.text}</p>
</div>
<I name="chevron_right" size={20} className="text-slate-300"/>
</button>
))}
</div>}
</div>
);};

/* ── PHONE SIMULATOR ── */
const IOSStatusBar=()=>{
const[,tick]=useState(0);
useEffect(()=>{const i=setInterval(()=>tick(n=>n+1),30000);return()=>clearInterval(i)},[]);
const d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');
return(
<div className="ios-sb">
<span>{h>12?h-12:h||12}:{m}</span>
<div style={{display:'flex',alignItems:'center',gap:5}}>
<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="2" width="3" height="10" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z" fill="#fff"/><path d="M4.5 8.2C5.5 7.2 6.7 6.5 8 6.5s2.5.7 3.5 1.7" stroke="#fff" strokeWidth="1.2" strokeLinecap="round" fill="none"/><path d="M1.8 5.5C3.4 3.9 5.5 3 8 3s4.6.9 6.2 2.5" stroke="#fff" strokeWidth="1.2" strokeLinecap="round" fill="none"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3" stroke="#fff" strokeOpacity=".35" fill="none"/><rect x="24.5" y="4" width="2" height="5" rx="1" fill="#fff" fillOpacity=".4"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="#34C759"/></svg>
</div>
</div>
);};

const IOSHomeScreen=({onOpenApp})=>{
const ga=[
{n:'FaceTime',bg:'#30D158',ic:'videocam'},
{n:'Calendar',bg:'#FF3B30',ic:'calendar_today'},
{n:'Photos',bg:'linear-gradient(135deg,#FF9500,#FF2D55,#AF52DE)',ic:'photo'},
{n:'Camera',bg:'#555',ic:'photo_camera'},
{n:'Maps',bg:'linear-gradient(135deg,#34C759,#4CD964)',ic:'map'},
{n:'Weather',bg:'linear-gradient(180deg,#5AC8FA,#007AFF)',ic:'wb_sunny'},
{n:'Clock',bg:'#1c1c1e',ic:'schedule'},
{n:'Notes',bg:'#FFD60A',ic:'note',dk:true},
{n:'Reminders',bg:'#fff',ic:'done_all',dk:true,icc:'#007AFF'},
{n:'News',bg:'linear-gradient(135deg,#FF3B30,#FF2D55)',ic:'library_books'},
{n:'Health',bg:'#fff',ic:'favorite',dk:true,icc:'#FF2D55'},
{n:'Divyajivan',bg:'#E6F7F1',isApp:true},
{n:'Settings',bg:'linear-gradient(180deg,#8E8E93,#636366)',ic:'settings'},
{n:'App Store',bg:'#007AFF',ic:'apps'},
{n:'Translate',bg:'linear-gradient(135deg,#5AC8FA,#007AFF)',ic:'translate'},
{n:'Shortcuts',bg:'linear-gradient(135deg,#FF2D55,#BF5AF2)',ic:'flash_on'},
];
const da=[
{n:'Phone',bg:'linear-gradient(180deg,#65D66A,#34C759)',ic:'call'},
{n:'Safari',bg:'linear-gradient(180deg,#5AC8FA,#007AFF)',ic:'language'},
{n:'Messages',bg:'linear-gradient(180deg,#65D66A,#34C759)',ic:'chat_bubble'},
{n:'Music',bg:'linear-gradient(180deg,#FB5C74,#FF2D55)',ic:'music_note'},
];
const ri=(a,i)=>(
<div key={i} className="ios-ic" onClick={a.isApp?onOpenApp:undefined}>
{a.isApp?<div className="ib" style={{background:a.bg,border:'1px solid rgba(0,0,0,0.06)'}}>
<img src="logo.webp" style={{width:'78%',height:'78%',objectFit:'contain',filter:'brightness(1.1) saturate(1.2)'}}/>
</div>:<div className="ib" style={{background:a.bg}}>
<I name={a.ic} size={30} filled style={{color:a.dk?(a.icc||'#1c1c1e'):'#fff'}}/>
</div>}
<span className="il">{a.n}</span>
</div>
);
return(
<div className="ios-home">
<div className="ios-wp"/>
<IOSStatusBar/>
<div style={{height:20,position:'relative',zIndex:10}}/>
<div className="ios-grid">{ga.map((a,i)=>ri(a,i))}</div>
<div style={{display:'flex',justifyContent:'center',gap:6,padding:'6px 0',position:'relative',zIndex:10}}>
<div style={{width:7,height:7,borderRadius:'50%',background:'rgba(255,255,255,0.9)'}}/>
<div style={{width:7,height:7,borderRadius:'50%',background:'rgba(255,255,255,0.3)'}}/>
<div style={{width:7,height:7,borderRadius:'50%',background:'rgba(255,255,255,0.3)'}}/>
</div>
<div className="ios-dw"><div className="ios-dk">{da.map((a,i)=>ri(a,i))}</div></div>
<div className="ios-hb"/>
</div>
);};

const PhoneWrapper=()=>{
const[view,setView]=useState('app');
const[appKey,setAppKey]=useState(0);
const[closing,setClosing]=useState(false);
const[scale,setScale]=useState(1);
const[isMobile,setIsMobile]=useState(window.innerWidth<=480);
useEffect(()=>{
const c=()=>{
const mob=window.innerWidth<=480;
setIsMobile(mob);
if(!mob){const s=Math.min((window.innerHeight-40)/852,(window.innerWidth-40)/393,1);setScale(Math.max(s,0.3));}
};
c();window.addEventListener('resize',c);return()=>window.removeEventListener('resize',c);
},[]);
const openApp=()=>{setAppKey(k=>k+1);setClosing(false);setView('app')};
const closeApp=()=>{setClosing(true);setTimeout(()=>{setView('home');setClosing(false)},250)};
if(isMobile)return <App/>;
return(
<div className="phone-page">
<div className="iphone-frame" style={{transform:`scale(${scale})`}}>
<div className="btn-r"/><div className="btn-l1"/><div className="btn-l2"/><div className="btn-l3"/>
<div className="iphone-screen">
<div className="iphone-notch"/>
{view==='home'?<IOSHomeScreen onOpenApp={openApp}/>:
<React.Fragment key={appKey}>
<div className={closing?'app-zo':'app-zi'} style={{width:'100%',height:'100%'}}>
<App/>
</div>
<div className="app-hb" onClick={closeApp}/>
</React.Fragment>}
</div>
</div>
</div>
);};

ReactDOM.render(<PhoneWrapper/>,document.getElementById('root'));
</script>
</body>
</html>
